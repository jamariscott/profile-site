<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141419"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand mark -->
  <rect x="90" y="96" width="88" height="88" rx="22" fill="url(#mark)"/>
  <text x="134" y="140" dy="0.35em" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">T</text>

  <!-- wordmark -->
  <text x="90" y="330" font-family="Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff">Timez of Today</text>

  <!-- tagline -->
  <text x="92" y="410" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="400" fill="#a1a1aa">Show the world what you do.</text>

  <!-- accent underline -->
  <rect x="92" y="448" width="150" height="6" rx="3" fill="#ec4899"/>

  <!-- url -->
  <text x="90" y="560" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#6b6b75">timezoftoday.com</text>
</svg>
